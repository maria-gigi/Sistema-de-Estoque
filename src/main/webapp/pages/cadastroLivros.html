<html>
    <head>
        <link rel="stylesheet" href="../css/reset.css"/>
        <link rel="stylesheet" href="../css/color.css"/>
        <link rel="stylesheet" href="../css/cadastroLivros.css"/>
        <title>Cadastrando Livro</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <header id="header" class="main-header">
            <div class="header-container">
                <h1 id="tituloDashboard" class="logo">
                    Sistema<span>Estoque</span>
                </h1>
                <nav class="nav-menu">
                    <ul>
                        <li><a href="dashboard.html" class="nav-link active">Início</a></li>
                        <li><a href="cadastroUsuario.html" class="nav-link btn-cadastro">Cadastro Usuario</a></li>
                        <li><a href="vendaProdutos.html" class="nav-link btn-cadastro">Venda</a></li>
                        <li><a href="#" id="btnLogout" class="btn-logout">Sair</a></li>
                    </ul>
                </nav>
            </div>
        </header>
        <main>
            <section id="form-container">
                <form action="../cadastro/livro" autocomplete="off" method="POST" id="formCadastro">
                    <div class="linha-form">
                        <label>Código de Barras</label>
                        <input type="text" name="codigoBarras" required />
                    </div>
                    <div class="grupo-form">
                        <label>Titulo</label>
                        <input type="text" name="titulo" required />
                    </div>
                    <div class="linha-form">
                        <label>Editora</label>
                        <input type="text" name="editora" required />
                    </div>
                    <div class="linha-form">
                        <label>Gênero</label>
                        <input type="text" name="genero" required />
                    </div>
                    <div class="grupo-form">
                        <label>Local de Armazenamento</label>
                        <input type="text" name="localArmazenamento" required />
                    </div>
                    <div class="linha-form">
                        <label>Data de Publicação</label>
                        <input type="date" name="dataPublicacao" required />
                    </div>
                    <div class="linha-form">
                         <div class="grupo-form">
                            <label>Quantidade</label>
                            <input type="number" name="quantidade" id="calcular" required />
                         </div>
                         <div class="grupo-form">
                            <label>Quantidade Mínima</label>
                            <input type="number" name="quantidadeMin" id="calcular" required />
                         </div>
                         <div class="grupo-form">
                            <label>Valor</label>
                            <input type="number" name="valor" id="calcular" required />
                         </div>
                    </div>
                    <div class="acoes-form">
                        <button type="submit" class="btn-salvar">Salvar</button>
                        <a href="dashboard.html" class="btn-cancelar">Cancelar</a>
                    </div>
                </form>
            </section>
        </main>
    </body>
</html>
