<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="../css/reset.css"/>
        <link rel="stylesheet" href="../css/color.css"/>
        <link rel="stylesheet" href="../css/dashboard.css"/>
        <title>Dashboard</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <header id="header" class="main-header">
            <div class="header-container">
                <h1 id="tituloDashboard" class="logo">
                    Sistema<span>Estoque</span>
                </h1>
                <nav class="nav-menu">
                    <ul>
                        <li><a href="cadastroLivros.html" class="nav-link btn-cadastro">Cadastro de Livros</a></li>
                        <li><a href="cadastroUsuario.html" class="nav-link btn-cadastro">Cadastro de Usuario</a></li>
                        <li><a href="vendaLivros.html" class="nav-link btn-cadastro">Venda</a></li>
                        <li><a href="#" id="btnLogout" class="btn-logout">Sair</a></li>
                    </ul>
                </nav>
            </div>
        </header>
        <main>
            <section id="resumoEstoque">
                <div class="card-resumo">
                    <h2 class="titulo-card">Entrada</h2>
                    <p class="valor-card" id="cardEntrada" ></p>
                </div>
                <div class="card-resumo">
                    <h2 class="titulo-card">Saída</h2>
                    <p class="valor-card" id="cardSaida"></p>
                </div>
                <div class="card-resumo">
                    <h2 class="titulo-card">Total</h2>
                    <p class="valor-card" id="cardTotal"></p>
                </div>
            </section>
            <section id="filtro">
                <div class="grupo-filtro">
                    <label for="filtroData">Data</label>
                    <input type="date" id="filtroData" class="input-filtro">
                </div>
                <div class="grupo-filtro">
                    <label for="genero">Gênero</label>
                    <input type="text" id="filtroGenero" class="input-filtro" placeholder="Gênero do livro">
                </div>
                <div class="grupo-filtro pesquisa-nome">
                    <label for="pesquisarNome">Pesquisar item</label>
                    <input type="text" id="pesquisarNome" class="input-filtro" placeholder="Digite o titulo do livro" >
                </div>
                <div class="grupo-filtro botao-pesquisa">
                    <button id="btnPesquisar" class="btn-pesquisa">Pesquisar</button>
                </div>
            </section>
            <section id="tabelaEstoqueContainer">
                <div class="tabela-wrapper">
                    <table id="tabelaEstoque">
                        <thead>
                            <tr>
                                <th>Código de barras</th>
                                <th>Título</th>
                                <th>Gênero</th>
                                <th>Editora</th>
                                <th>Data de Publi.</th>
                                <th>Local Armazenamento </th>
                                <th>quantidade</th>
                                <th>quantidade Min.</th>
                                <th>valor</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabela">
                           
                        </tbody>
                    </table>
                </div>
            </section>
            <section id="paginacao">
                <div class="controle-paginacao">
                    <label for="pagina">Página</label>
                    <select id="pagina">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>
                <div class="conteiner-btn">
                    <button id="btnVoltar" class="btn-voltar">Voltar</button>
                    <button id="btnProximo" class="btn-proximo">Próximo</button>
                </div>
            </section>
        </main>
        <script src ="../js/dashboard.js"></script>
        <script src ="../js/filtro.js"></script>
        <script src ="../js/validarLogin.js"></script>
        <script src ="../js/logout.js"></script>
    </body>
</html>
